services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social_assistant_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-Personal AI Social Media Assistant}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-social_assistant}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET}"
      LINKEDIN_REDIRECT_URI: "${APP_URL}/api/v1/accounts/oauth/linkedin/callback"
      X_CLIENT_ID: "${X_CLIENT_ID}"
      X_CLIENT_SECRET: "${X_CLIENT_SECRET}"
      X_REDIRECT_URI: "${APP_URL}/api/v1/accounts/oauth/x_twitter/callback"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DAILY_BUDGET_CAP_USD: "${DAILY_BUDGET_CAP_USD:-10.00}"
      MONTHLY_BUDGET_CAP_USD: "${MONTHLY_BUDGET_CAP_USD:-150.00}"
    volumes:
      - media_storage:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: social_assistant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-social_assistant}"
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-social_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: social_assistant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  media_storage:

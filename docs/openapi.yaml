openapi: 3.1.0
info:
  title: Personal AI Social Media Assistant API
  version: 1.0.0
  description: Authoritative OpenAPI 3.1 Contract for managing LinkedIn and X social automation, AI content ideation, scheduling, publishing, and engagement.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Environment

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth/logout:
    post:
      summary: Invalidate user session
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: object, properties: { message: { type: string, example: 'Logged out successfully' } } }

  /settings:
    get:
      summary: Get system settings and budget caps
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: object }
    post:
      summary: Update system settings and budget caps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: object }

  /accounts:
    get:
      summary: List connected social accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SocialAccount' }

  /accounts/oauth/{provider}/redirect:
    get:
      summary: Get OAuth authorization URL for provider
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [linkedin, x_twitter] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      authorization_url: { type: string, format: uri }

  /accounts/oauth/{provider}/callback:
    post:
      summary: Handle OAuth callback and exchange authorization code
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [linkedin, x_twitter] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/SocialAccount' }
        '400':
          $ref: '#/components/responses/400BadRequest'

  /accounts/{id}/disconnect:
    delete:
      summary: Disconnect and deactivate a social account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: object, properties: { disconnected: { type: boolean, example: true } } }

  /trends/items:
    get:
      summary: List curated trend intelligence items
      parameters:
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: bookmarked
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrendItem' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /trends/items/{id}/bookmark:
    patch:
      summary: Toggle bookmark status for a trend item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/TrendItem' }

  /drafts:
    get:
      summary: List content drafts
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, in_review, approved, scheduled, published, failed, rejected] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Draft' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      summary: Create a new draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, target_platforms, versions]
              properties:
                title: { type: string }
                category_id: { type: string, format: uuid }
                target_platforms:
                  type: array
                  items: { type: string, enum: [linkedin, x_twitter] }
                scheduled_at: { type: string, format: date-time, nullable: true }
                versions:
                  type: array
                  items: { $ref: '#/components/schemas/DraftVersionInput' }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Draft' }

  /drafts/{id}:
    get:
      summary: Get draft details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Draft' }
        '404':
          $ref: '#/components/responses/404NotFound'

  /drafts/{id}/approve:
    post:
      summary: Explicit human-in-the-loop approval of draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Draft' }

  /drafts/ai/generate:
    post:
      summary: Generate post drafts via AI from topic or trend item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_or_idea]
              properties:
                trend_item_id: { type: string, format: uuid }
                topic_or_idea: { type: string }
                tone_style: { type: string, enum: [thought_leader, provocative, actionable, storytelling, technical] }
                platforms:
                  type: array
                  items: { type: string, enum: [linkedin, x_twitter] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Draft' }

  /media/upload:
    post:
      summary: Upload a media asset (Image, Video, PDF Document)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt_text: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/MediaAsset' }

  /media/ai/generate:
    post:
      summary: Dispatch AI image generation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                draft_id: { type: string, format: uuid }
                provider: { type: string, enum: [gemini, dalle3, flux, stability], default: flux }
                prompt: { type: string }
                aspect_ratio: { type: string, enum: ['1:1', '16:9', '4:5'], default: '16:9' }
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      request_id: { type: string, format: uuid }
                      status: { type: string, example: 'pending' }

  /calendar/schedules:
    get:
      summary: Get scheduled posts within a date range
      parameters:
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schedule' }

  /drafts/{id}/publish-now:
    post:
      summary: Immediately dispatch draft to linked social accounts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: 'Publishing job queued' }
                      draft_id: { type: string, format: uuid }

  /inbox/comments:
    get:
      summary: List incoming comments from social platforms
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [unanswered, draft, sent, ignored] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /analytics/dashboard:
    get:
      summary: Get executive engagement and reach metrics
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d], default: 30d }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AnalyticsOverview' }

  /audits:
    get:
      summary: List system audit trail records
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 85 }
        last_page: { type: integer, example: 5 }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        avatar_url: { type: string, nullable: true }
        role: { type: string }

    AuthSuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            token: { type: string }
            token_type: { type: string, example: 'Bearer' }
            user: { $ref: '#/components/schemas/User' }

    SocialAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [linkedin, x_twitter] }
        name: { type: string }
        username: { type: string }
        avatar_url: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    TrendItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string, nullable: true }
        url: { type: string, format: uri }
        author: { type: string, nullable: true }
        published_at: { type: string, format: date-time }
        engagement_score: { type: number }
        is_bookmarked: { type: boolean }

    DraftVersionInput:
      type: object
      required: [platform, content]
      properties:
        platform: { type: string, enum: [universal, linkedin, x_twitter] }
        content: { type: string }
        thread_items: { type: array, items: { type: string } }
        tone: { type: string }

    DraftVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        version_number: { type: integer }
        platform: { type: string }
        content: { type: string }
        character_count: { type: integer }
        thread_items: { type: array, items: { type: string } }
        created_by_ai: { type: boolean }

    Draft:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string }
        target_platforms: { type: array, items: { type: string } }
        scheduled_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        versions: { type: array, items: { $ref: '#/components/schemas/DraftVersion' } }
        media: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } }

    MediaAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        url: { type: string, format: uri }
        mime_type: { type: string }
        file_size_bytes: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        alt_text: { type: string, nullable: true }

    Schedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        social_account_id: { type: string, format: uuid }
        scheduled_for: { type: string, format: date-time }
        status: { type: string }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_post_id: { type: string }
        author_name: { type: string }
        author_handle: { type: string }
        content: { type: string }
        sentiment: { type: string }
        ai_suggested_reply: { type: string, nullable: true }
        reply_status: { type: string }
        published_at: { type: string, format: date-time }

    AnalyticsOverview:
      type: object
      properties:
        total_impressions: { type: integer }
        total_engagements: { type: integer }
        avg_engagement_rate: { type: number }
        posts_published: { type: integer }
        growth_percentage: { type: number }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        auditable_type: { type: string }
        auditable_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ProblemDetails:
      type: object
      description: RFC 7807 Standard Error Details
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri, example: 'https://api.social-assistant.internal/errors/validation-failed' }
        title: { type: string, example: 'Unprocessable Entity' }
        status: { type: integer, example: 422 }
        detail: { type: string, example: 'The provided parameters failed validation.' }
        code: { type: string, example: 'VALIDATION_FAILED' }
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }

  responses:
    400BadRequest:
      description: Invalid client request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    401Unauthorized:
      description: Authentication credentials missing or expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    404NotFound:
      description: Target resource was not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    422ValidationError:
      description: Semantic request validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
